<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Undangan Pernikahan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b0b;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="weddingFrame" allow="autoplay" src=""></iframe>

  <script>
    var baseUrl = "https://script.google.com/macros/s/AKfycbxrlxHmSg3OWeL1U0ZDPgytzCu2WIvADCD7jhwSK_2D4rlVbKtAQG0wxND0f6jYnRGI/exec";
    var query = window.location.search;

    // Jika link dibuka tanpa parameter tambahan, teruskan default id klien
    if (!query || query === "") {
      query = "?id=vania-riyan";
    }

    document.getElementById("weddingFrame").src = baseUrl + query;
  </script>
</body>
</html>
